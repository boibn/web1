<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>vaulted</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0407;--ink:#ffe6ea;--muted:#b98d96;--pink:#f0748c;--hot:#ff5c85;--card:rgba(34,13,18,.62);--line:rgba(255,255,255,.07);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow-x:hidden;background:radial-gradient(120% 90% at 50% 40%,#1b0a10 0%,var(--bg) 70%) var(--bg);color:var(--ink);font:400 15px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
#bg{position:fixed;inset:0;width:100%;height:100%;display:block}
.veil{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,rgba(8,2,4,.6),transparent 52%),radial-gradient(ellipse at 50% 50%,transparent 40%,rgba(4,1,2,.6) 100%)}

/* nav */
#nav{position:fixed;z-index:5;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);transition:transform .35s cubic-bezier(.2,.7,.2,1),top .35s;display:flex;align-items:center;gap:4px;padding:8px;max-width:calc(100vw - 20px);border-radius:22px;background:rgba(58,20,29,.5);border:1px solid rgba(255,140,160,.16);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 32px rgba(0,0,0,.4)}
.nv{position:relative;flex:none;display:grid;place-items:center;width:42px;height:42px;border-radius:13px;border:1px solid transparent;background:none;color:#d6a5af;cursor:pointer;transition:color .15s,background .15s,transform .15s}
.nv svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nv:hover{color:#fff;background:rgba(255,255,255,.07);transform:translateY(-1px)}
.nv.on{color:#fff;background:rgba(255,80,110,.2);border-color:rgba(255,100,130,.4)}
.nv:focus-visible,#go:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
.sep{flex:none;width:1px;height:26px;margin:0 8px;background:rgba(255,255,255,.12)}
.nv::after{content:attr(data-tip);position:absolute;top:calc(100% + 10px);left:50%;transform:translateX(-50%);padding:4px 9px;border-radius:8px;background:#1d0b10;border:1px solid var(--line);color:var(--ink);font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
.nv:hover::after,.nv:focus-visible::after{opacity:1}

/* hero */
main{position:relative;z-index:2;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:96px 16px 64px;text-align:center}
.brand{display:flex;align-items:center;gap:16px}
.logo{width:clamp(38px,4vw,48px);height:auto;color:#fff;fill:none;stroke:currentColor;stroke-width:2.2;filter:drop-shadow(0 0 14px rgba(255,90,120,.35))}
#wm{margin:0;font-size:clamp(3.2rem,5vw + 1rem,4.75rem);font-weight:700;letter-spacing:-.045em;line-height:1;background:linear-gradient(180deg,#f78ea3,#dc5f7b);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 26px rgba(255,70,110,.3))}
#hi{margin:26px 0 0;font-size:1.06rem;font-weight:600;color:var(--pink)}

/* search */
#sb{position:relative;display:flex;align-items:center;gap:12px;width:min(600px,92vw);height:52px;margin-top:30px;padding:0 6px 0 18px;border-radius:26px;background:rgba(14,5,8,.85);border:1px solid rgba(255,255,255,.08);box-shadow:0 12px 40px rgba(0,0,0,.45);transition:border-color .2s,box-shadow .2s}
#sb:focus-within{border-color:rgba(255,92,133,.55);box-shadow:0 0 0 4px rgba(255,92,133,.12),0 12px 40px rgba(0,0,0,.45)}
.mag{flex:none;width:17px;height:17px;fill:none;stroke:#c9a0a8;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#q{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;color:var(--ink);font:inherit}
#q::placeholder{color:#a97f88}
#go{flex:none;display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:50%;background:var(--hot);color:#1a0509;cursor:pointer;transition:transform .15s,filter .15s}
#go:hover{transform:scale(1.07);filter:brightness(1.08)}
#go svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#lights{position:absolute;left:-27px;top:-27px;pointer-events:none;overflow:visible}
.hl{animation:hl 3.2s ease-in-out infinite}
.bb{animation:bb 3.2s ease-in-out infinite}
@keyframes hl{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes bb{0%,100%{opacity:.75}50%{opacity:1}}

/* cards */
.cards{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:26px}
.card{min-width:200px;min-height:108px;padding:16px 18px;border-radius:16px;text-align:left;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.card.c2{display:flex;flex-direction:column;justify-content:center}
.card b{display:block;font-size:1.9rem;font-weight:700;letter-spacing:-.02em;line-height:1.1;color:#ffe9ed}
.card small{display:block;margin-top:4px;font-size:11.5px;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.row svg{width:14px;height:14px;flex:none;fill:none;stroke:var(--pink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row.t{margin-bottom:8px;font-size:13.5px;font-weight:700;color:#ffe9ed}

footer{position:fixed;z-index:3;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;gap:12px;padding:0 18px;font-size:11.5px;color:#8c6a72;pointer-events:none}
footer .c{color:var(--pink);font-weight:500}
#toast{position:fixed;z-index:6;left:50%;bottom:calc(52px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);padding:9px 16px;border-radius:12px;background:#1d0b10;border:1px solid rgba(255,100,130,.3);color:var(--ink);font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* tabbed views */
html{scrollbar-width:thin;scrollbar-color:#3a1620 transparent}
#chrome{display:none;position:fixed;z-index:7;top:0;left:0;right:0;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 10px;background:rgba(10,4,7,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
body:not([data-view="home"]) #chrome{display:block}
body:not([data-view="home"]){background:#0c0508}
body:not([data-view="home"]) :is(main,footer,#bg,.veil){display:none}
body:not([data-view="home"]) #nav{z-index:9;top:0;transform:translate(-50%,calc(-100% + 9px))}
body:not([data-view="home"]) #nav::before{content:"";position:absolute;left:50%;bottom:2px;width:36px;height:3px;border-radius:3px;background:var(--hot);transform:translateX(-50%)}
body:not([data-view="home"]) #nav:hover,body:not([data-view="home"]) #nav.open{transform:translate(-50%,12px)}
#tabs{display:flex;align-items:center;gap:9px;overflow-x:auto;scrollbar-width:none}
.tab{flex:0 1 190px;min-width:96px;display:flex;align-items:center;gap:9px;height:32px;padding:0 12px;border:0;border-radius:10px;background:none;color:#cfa9b2;font:500 13px Inter,system-ui,sans-serif;text-align:left;cursor:pointer}
.tab:hover{background:rgba(255,255,255,.05)}
.tab.on{background:#fb6f8e;color:#fff}
.tab i{flex:none;display:grid;place-items:center;width:13px;height:13px;border-radius:4px;background:rgba(255,255,255,.14);font:700 7px/1 Inter,sans-serif;font-style:normal}
.tab.on i{background:rgba(0,0,0,.22)}
.tab span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab b{display:none;flex:none;font-weight:500;opacity:.85}
.tab:hover b,.tab.on b{display:block}
#bar{display:flex;align-items:center;gap:8px;margin-top:12px}
.ib{flex:none;display:grid;place-items:center;width:32px;height:32px;border:0;border-radius:9px;background:none;color:#c9a0a8;cursor:pointer}
.ib:hover{background:rgba(255,255,255,.07);color:#fff}
.ib:disabled{opacity:.35;cursor:default;background:none}
#addr{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:32px;padding:0 14px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.05);font-size:13px;color:#e9cdd3}
#addr svg{color:#4ade80}
.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pg{display:none;position:relative;z-index:2;padding:112px clamp(16px,7vw,130px) 56px}
body[data-view="games"] #games,body[data-view="settings"] #settings{display:block}
.pt{margin:0;font-size:2.25rem;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.sub{margin:8px 0 0;font-size:12.5px;color:var(--muted)}
.sub.n{margin-top:20px}
.gh{display:grid;grid-template-columns:250px 1fr;gap:0 18px;align-items:start}
.gt{display:flex;align-items:center;gap:9px}
.gs{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:46px;padding:0 16px;border-radius:14px;background:rgba(80,24,36,.32);border:1px solid rgba(255,255,255,.06);color:#a97f88}
.gs:focus-within{border-color:rgba(255,92,133,.5)}
.gs input{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;color:var(--ink);font:inherit;font-size:14px}
.gs input::placeholder{color:#a97f88}
.pill{flex:none;display:flex;align-items:center;gap:8px;height:34px;padding:0 13px;border-radius:11px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:#e9cdd3;font:500 12.5px Inter,system-ui,sans-serif;white-space:nowrap;cursor:pointer}
.pill:hover{background:rgba(255,255,255,.07)}
.seg{grid-column:1/-1;justify-self:start;display:flex;gap:4px;margin-top:24px;padding:5px;border-radius:16px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.03)}
.seg button{display:flex;align-items:center;gap:7px;height:34px;padding:0 14px;border:0;border-radius:12px;background:none;color:#b98d96;font:600 12.5px Inter,system-ui,sans-serif;cursor:pointer}
.seg button.on{background:rgba(255,255,255,.08);color:#fff}
.seg small{font-size:11px;font-weight:500;opacity:.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tile,150px),1fr));gap:20px;margin-top:22px}
.g{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.08);cursor:pointer;transition:transform .18s}
.g:hover{transform:translateY(-3px)}
.g:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
.g.pop{outline:2px solid var(--hot);outline-offset:3px}
.g .art{position:absolute;inset:0;display:grid;place-items:center;font-size:64px;font-weight:800;color:rgba(255,255,255,.2)}
.g .ov{position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.78))}
.g .tt{position:absolute;left:12px;right:12px;bottom:11px;font-size:12px;font-weight:600;line-height:1.25;text-align:left;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.g .ac{position:absolute;top:10px;right:10px;display:flex;gap:7px}
.g .ac button{display:grid;place-items:center;width:32px;height:32px;border:0;border-radius:9px;background:rgba(20,8,12,.55);color:#fff;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.g .ac button:hover{background:rgba(20,8,12,.85)}
.g .ac button.on{color:var(--hot)}
.g .ac button.on svg{fill:currentColor}
#tour{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(8,2,4,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.tc{width:min(440px,100%);border-radius:20px;background:linear-gradient(180deg,#1f0c12,#12060a);border:1px solid rgba(255,140,160,.18);box-shadow:0 30px 80px rgba(0,0,0,.65),0 0 70px rgba(255,70,110,.12);color:var(--ink);animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(8px) scale(.98)}}
.th{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 0}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:6px;height:6px;border-radius:6px;background:rgba(255,255,255,.16);transition:width .25s,background .25s}
.dots i.on{width:26px;background:var(--hot)}
.tx{display:grid;place-items:center;width:28px;height:28px;border:0;border-radius:8px;background:none;color:#b98d96;cursor:pointer}
.tx:hover{background:rgba(255,255,255,.07);color:#fff}
.tb{padding:18px 20px 22px}
.ti{display:grid;place-items:center;width:50px;height:50px;border-radius:14px;background:rgba(255,80,110,.14);border:1px solid rgba(255,100,130,.28);color:#ff8aa4}
.ti .i{width:22px;height:22px;stroke-width:1.8}
.tb h3{margin:20px 0 10px;font-size:1.25rem;line-height:1.3;font-weight:700;letter-spacing:-.01em}
.tb p{margin:0;font-size:15px;line-height:1.55;color:#dcbcc3}
.fl{margin:18px 0 8px;font-size:13px;font-weight:700}
.sel{position:relative}
.sel select{width:100%;height:42px;padding:0 40px 0 14px;border:1px solid rgba(255,140,160,.16);border-radius:14px;background:rgba(80,24,36,.4);color:#fff;font:700 15px Inter,system-ui,sans-serif;appearance:none;-webkit-appearance:none;cursor:pointer}
.sel select option{background:#1d0b11;color:#fff}
.sel select:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
.sel .i{position:absolute;right:14px;top:13px;pointer-events:none;color:#fff}
.tf{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-top:1px solid rgba(255,140,160,.12)}
.sk{border:0;background:none;color:#b98d96;font:500 14px Inter,system-ui,sans-serif;cursor:pointer;padding:6px 2px}
.sk:hover{color:#fff}
.nx{display:flex;align-items:center;gap:8px;height:40px;padding:0 18px;border:0;border-radius:12px;background:var(--hot);color:#1a0509;font:700 14px Inter,system-ui,sans-serif;cursor:pointer}
.nx:hover{filter:brightness(1.1)}
.nx:focus-visible{outline:2px solid #fff;outline-offset:2px}
.nx .i{width:15px;height:15px}
/* games toolbar */
.gh2{margin-bottom:22px}
.gbar{position:sticky;top:calc(102px + env(safe-area-inset-top,0px));z-index:4;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px;border-radius:20px;background:rgba(24,9,14,.76);border:1px solid rgba(255,140,160,.14);box-shadow:0 12px 34px rgba(0,0,0,.4);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.gbar .gs{flex:1 1 240px;height:42px}
.gs kbd{flex:none;display:grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:7px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:#b98d96;font:600 11px Inter,system-ui,sans-serif}
.gs:focus-within kbd{display:none}
.gx{flex:none;display:grid;place-items:center;width:24px;height:24px;border:0;border-radius:8px;background:rgba(255,255,255,.1);color:#f1d6dc;font-size:15px;line-height:1;cursor:pointer}
.gx:hover{background:rgba(255,255,255,.18)}
.gbar .seg{grid-column:auto;margin:0;padding:4px;border-radius:14px}
.gbar .seg button{height:32px}
.gsel{position:relative}
.gsel select{height:42px;padding:0 34px 0 14px;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:rgba(255,255,255,.04);color:#e9cdd3;font:600 12.5px Inter,system-ui,sans-serif;appearance:none;-webkit-appearance:none;cursor:pointer}
.gsel select option{background:#1d0b11;color:#fff}
.gsel select:hover{background:rgba(255,255,255,.08)}
.gsel .i{position:absolute;right:11px;top:13px;pointer-events:none;color:#b98d96}
.zoom{display:flex;gap:2px;padding:3px;border-radius:12px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04)}
.zoom button{width:32px;height:34px;border:0;border-radius:9px;background:none;color:#b98d96;font:700 11.5px Inter,system-ui,sans-serif;cursor:pointer}
.zoom button:hover{color:#fff}
.zoom button.on{background:rgba(255,255,255,.12);color:#fff}
.ibtn{flex:none;display:grid;place-items:center;width:42px;height:42px;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:rgba(255,255,255,.04);color:#e9cdd3;cursor:pointer;transition:background .15s,transform .15s}
.ibtn:hover{background:rgba(255,255,255,.1);transform:translateY(-1px)}
.ibtn .i{width:17px;height:17px}
.gbar .pill{height:42px;padding:0 16px;border-radius:12px;border-color:transparent;background:var(--hot);color:#1a0509;font-weight:700}
.gbar .pill:hover{background:var(--hot);filter:brightness(1.1)}
.gbar :is(select,.zoom button,.ibtn,.pill,.gx):focus-visible{outline:2px solid var(--hot);outline-offset:2px}
.empty{grid-column:1/-1;padding:28px 4px}
@media (max-width:800px){.gbar{position:static}}
/* loading screens */
#boot{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 40%,#1b0a10 0%,#0b0407 70%) #0b0407;transition:opacity .5s ease,transform .5s cubic-bezier(.2,.7,.2,1),visibility 0s .5s;animation:bfail .4s 6s forwards}
#boot.done{opacity:0;transform:scale(1.04);visibility:hidden;pointer-events:none}
@keyframes bfail{to{opacity:0;visibility:hidden}}
.bt{display:flex;flex-direction:column;align-items:center;gap:22px}
.bt .logo{width:64px;height:64px;animation:bpulse 1.6s ease-in-out infinite}
.bt b{font-size:2rem;font-weight:700;letter-spacing:-.04em;line-height:1;background:linear-gradient(180deg,#f78ea3,#dc5f7b);-webkit-background-clip:text;background-clip:text;color:transparent}
.bar{width:180px;height:3px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;width:100%;border-radius:3px;background:linear-gradient(90deg,#ff5c85,#f78ea3);transform-origin:left;transform:scaleX(0);transition:transform .35s ease-out}
.bar.ind i{width:40%;transform:none;animation:bslide 1.2s ease-in-out infinite}
@keyframes bpulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 10px rgba(255,90,120,.3))}50%{transform:scale(1.08);filter:drop-shadow(0 0 24px rgba(255,90,120,.6))}}
@keyframes bslide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@keyframes spin{to{transform:rotate(360deg)}}
body.booting :is(main,footer,#nav,.nv){animation-play-state:paused}
#pload{position:absolute;left:0;right:0;bottom:0;top:calc(54px + env(safe-area-inset-top,0px));z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#0c0508;color:#b98d96;font-size:14px;transition:opacity .35s,visibility 0s}
#pload.off{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .35s,visibility 0s .35s}
#pload b{color:var(--ink);font-weight:600}
#pnote{max-width:min(440px,86vw);margin:6px 0 0;padding:12px 16px;border-radius:14px;background:rgba(255,80,110,.08);border:1px solid rgba(255,100,130,.22);color:#dcbcc3;line-height:1.55;text-align:center}
#pnote:empty{display:none}
.spin{width:44px;height:44px;border-radius:50%;border:3px solid rgba(255,255,255,.1);border-top-color:var(--hot);animation:spin .8s linear infinite}
@media (prefers-reduced-motion:reduce){.bt .logo,.spin,.bar.ind i{animation:none}}
/* loading screen v2 */
@property --r{syntax:'<length-percentage>';inherits:false;initial-value:0%}
#boot{overflow:hidden;background:radial-gradient(90% 70% at 50% 45%,#240d15 0%,#0d0408 65%,#070204 100%);-webkit-mask-image:radial-gradient(circle at 50% 50%,transparent var(--r),#000 calc(var(--r) + 2px));mask-image:radial-gradient(circle at 50% 50%,transparent var(--r),#000 calc(var(--r) + 2px));transition:opacity .45s ease .3s,visibility 0s .75s}
#boot.done{opacity:0;transform:none;visibility:hidden;pointer-events:none;animation:bopen .75s cubic-bezier(.65,0,.25,1) forwards}
@keyframes bopen{to{--r:150%}}
.bglow{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;pointer-events:none}
.bg1{width:46vmax;height:46vmax;left:-12vmax;top:-14vmax;background:radial-gradient(circle,rgba(255,60,100,.55),transparent 65%);animation:bdrift 9s ease-in-out infinite alternate}
.bg2{width:40vmax;height:40vmax;right:-10vmax;bottom:-16vmax;background:radial-gradient(circle,rgba(190,40,90,.5),transparent 65%);animation:bdrift 11s ease-in-out infinite alternate-reverse}
@keyframes bdrift{to{transform:translate(6vmax,4vmax) scale(1.15)}}
#boot .bt{position:relative;z-index:1;gap:18px}
.bmark{position:relative;display:grid;place-items:center;width:112px;height:112px}
.ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(255,100,135,.5);opacity:0;animation:bring 2.4s cubic-bezier(.2,.6,.3,1) infinite}
.ring.r2{animation-delay:1.2s}
@keyframes bring{0%{transform:scale(.55);opacity:.7}100%{transform:scale(1.5);opacity:0}}
.bt .logo{position:relative;width:68px;height:68px}
#boot .bt b{display:flex;background:none;font-size:2.4rem}
#boot .bt b span{display:inline-block;background:linear-gradient(180deg,#f78ea3,#dc5f7b);-webkit-background-clip:text;background-clip:text;color:transparent;animation:bletter .6s cubic-bezier(.2,.8,.3,1) backwards;animation-delay:calc(.15s + var(--i) * 60ms)}
@keyframes bletter{from{opacity:0;transform:translateY(16px);filter:blur(6px)}}
#boot .bar{width:min(240px,64vw);height:4px;overflow:visible}
#boot .bar i{box-shadow:0 0 14px rgba(255,92,133,.7);transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.bmeta{display:flex;justify-content:space-between;width:min(240px,64vw);margin-top:-6px;font-size:12px;color:#b98d96;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.ring,.bglow,#boot .bt b span{animation:none}#boot.done{animation:none;transition:opacity .2s}}
/* game player */
#player{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;background:#0c0508;animation:vin .3s cubic-bezier(.2,.7,.2,1)}
.pbar{display:flex;align-items:center;gap:14px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px}
.pbar span{font-weight:600;color:var(--ink)}
#pframe{flex:1;width:100%;border:0;background:#000}
/* top bar animations */
@keyframes nin{from{opacity:0;transform:translate(-50%,-26px) scale(.96)}}
@keyframes nvin{from{opacity:0;transform:translateY(10px) scale(.7)}}
@keyframes nsheen{0%,55%{background-position:150% 0}100%{background-position:-50% 0}}
@keyframes tabin{from{opacity:0;transform:translateY(-8px) scale(.9)}}
#nav{animation:nin .65s cubic-bezier(.2,.8,.2,1) backwards}
#nav::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(105deg,transparent 40%,rgba(255,170,190,.14) 50%,transparent 60%) 150% 0/250% 100% no-repeat;animation:nsheen 6s ease-in-out 1.2s infinite;pointer-events:none}
body:not([data-view="home"]) #nav::after{animation:none}
.nv{animation:nvin .5s cubic-bezier(.2,.8,.3,1) backwards;animation-delay:calc(.25s + var(--n,0) * 45ms);transition:color .15s,background .15s,transform .25s cubic-bezier(.3,1.5,.5,1)}
.nv:hover{transform:translateY(-2px) scale(1.1)}
.nv:active{transform:scale(.92)}
.nv.on{background:none;border-color:transparent}
.nv::after{transform:translateX(-50%) translateY(-5px);transition:opacity .15s,transform .2s}
.nv:hover::after,.nv:focus-visible::after{transform:translateX(-50%) translateY(0)}
.nbub{position:absolute;left:0;top:0;width:42px;height:42px;border-radius:13px;background:rgba(255,80,110,.2);border:1px solid rgba(255,100,130,.4);pointer-events:none;transition:transform .42s cubic-bezier(.3,1.35,.5,1),width .3s,height .3s}
#tabs{position:relative}
.tab{position:relative}
.tab.on{background:none}
.tab.new{animation:tabin .35s cubic-bezier(.2,.8,.3,1) backwards}
.tbub{position:absolute;left:0;top:0;height:32px;border-radius:10px;background:#fb6f8e;pointer-events:none;transition:transform .4s cubic-bezier(.3,1.2,.5,1),width .3s}
@media (prefers-reduced-motion:reduce){#nav,#nav::after,.nv,.tab.new{animation:none}.nbub,.tbub{transition:none}}
/* tour animations */
@keyframes tbg{from{opacity:0}}
@keyframes tout{to{opacity:0}}
@keyframes tcout{to{opacity:0;transform:translateY(10px) scale(.97)}}
@keyframes tup{from{opacity:0;transform:translateY(10px)}}
@keyframes tpop{from{opacity:0;transform:scale(.5) rotate(-12deg)}60%{transform:scale(1.08) rotate(3deg)}}
@keyframes tglow{0%,100%{box-shadow:0 0 0 0 rgba(255,90,125,0)}50%{box-shadow:0 0 26px 2px rgba(255,90,125,.28)}}
@keyframes dgrow{from{width:6px}}
.tc{overflow:hidden}
#tour{animation:tbg .25s ease-out}
#tour.bye{animation:tout .23s ease-in forwards}
#tour.bye .tc{animation:tcout .23s ease-in forwards}
.tc.lv .tb{opacity:0;transform:translateX(-18px);transition:opacity .15s ease-in,transform .15s ease-in}
.tb .ti{animation:tpop .5s cubic-bezier(.2,.8,.3,1) both,tglow 3s .6s ease-in-out infinite}
.tb h3{animation:tup .4s .08s cubic-bezier(.2,.7,.2,1) both}
.tb p{animation:tup .4s .15s cubic-bezier(.2,.7,.2,1) both}
.tb .fx>*{animation:tup .4s cubic-bezier(.2,.7,.2,1) both}
.tb .fx>:nth-child(1){animation-delay:.2s}
.tb .fx>:nth-child(2){animation-delay:.26s}
.tb .fx>:nth-child(3){animation-delay:.32s}
.tb .fx>:nth-child(4){animation-delay:.38s}
.dots i.on{animation:dgrow .4s cubic-bezier(.2,.7,.2,1)}
.nx{transition:filter .15s,transform .15s}
.nx:active{transform:scale(.96)}
.nx .i{transition:transform .2s}
.nx:hover .i{transform:translateX(3px)}
@media (prefers-reduced-motion:reduce){#tour,#tour *{animation:none!important;transition:none!important}}
.act{display:inline-flex;align-items:center;gap:8px;margin-top:18px;height:40px;padding:0 16px;border:1px solid rgba(255,100,130,.4);border-radius:12px;background:rgba(255,80,110,.14);color:#ffb3c4;font:700 14px Inter,system-ui,sans-serif;cursor:pointer;transition:background .15s,transform .15s}
.act:hover{background:rgba(255,80,110,.24)}
.act:active{transform:scale(.97)}

@keyframes vin{from{opacity:0;transform:translateY(14px) scale(.985)}}
@keyframes chin{from{opacity:0;transform:translateY(-14px)}}

function moveBub(snap){
 const b=nav.querySelector('.nv.on'),bub=nav.querySelector('.nbub');if(!b||!bub)return;
 snap=snap||!bubSet;bubSet=true;
 if(snap)bub.style.transition='none';
 bub.style.width=b.offsetWidth+'px';bub.style.height=b.offsetHeight+'px';
 bub.style.transform=`translate(${b.offsetLeft}px,${b.offsetTop}px)`;
 if(snap){bub.getBoundingClientRect();bub.style.transition=''}
}

 $('#url').textContent='vaulted://'+META[view].p;
 const act=$('#tabs .tab.on');
 if(act&&act.offsetWidth){
  const bub=document.createElement('i'),x=act.offsetLeft,w=act.offsetWidth,p=pb||{x,w};
  bub.className='tbub';bub.style.cssText=`transform:translateX(${p.x}px);width:${p.w}px`;
  $('#tabs').prepend(bub);bub.getBoundingClientRect();
  bub.style.transform=`translateX(${x}px)`;bub.style.width=w+'px';pb={x,w};
 }

}
/* the Home view hides all tab chrome; every other view shows it */
let swapT,booted=false;
function setView(v){
 const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
 if(!booted||rm||v===view){booted=true;return commitView(v)}
 clearTimeout(swapT);const b=document.body;
 b.classList.add('out');if(v==='home')b.classList.add('out2');
 swapT=setTimeout(()=>{commitView(v);b.classList.remove('out','out2')},170);
}
function commitView(v){
 const was=view;view=v;document.body.dataset.view=v;
 if(v!=='home'&&!tabs.includes(v)){tabs.push(v);newTab=v}
 if(v==='home')pb=null;
 nav.querySelectorAll('.nv').forEach(b=>b.classList.toggle('on',b.dataset.k===NAVK[v]));
 moveBub();
 drawTabs();if(v==='games'){drawGames();if(was!==v){const gr=$('#grid');gr.classList.add('in');setTimeout(()=>gr.classList.remove('in'),1400)}}if(v==='settings')$('#sfx').innerHTML=fields();scrollTo(0,0);
}

/* game player: fetches the game's html and runs it in a full-screen frame */
function play(g){
 let o=$('#player');
 if(!o){
  o=document.createElement('div');o.id='player';
  o.innerHTML='<div class="pbar"><button class="pill" id="pclose">'+ic('back')+'Back to games</button><span id="ptitle"></span></div><div id="pload"><div class="spin"></div><span>Loading <b></b></span><div class="bar ind"><i></i></div><p id="pnote"></p></div><iframe id="pframe" allow="fullscreen; autoplay; gamepad; pointer-lock" allowfullscreen sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-popups allow-forms"></iframe>';
  document.body.appendChild(o);
  $('#pclose').onclick=()=>{o.hidden=true;$('#pframe').srcdoc=''};
  addEventListener('keydown',e=>{if(e.key==='Escape'&&!o.hidden)$('#pclose').click()});
 }
 const f=$('#pframe');$('#ptitle').textContent=g;o.hidden=false;
 const L=$('#pload');L.classList.remove('off');L.querySelector('b').textContent=g;$('#pnote').textContent=NOTE[g]||'';const t0=Date.now(),hold=NOTE[g]?4000:0;
 f.onload=null;f.srcdoc='';clearTimeout(play.t);play.t=setTimeout(()=>L.classList.add('off'),15000);
 fetch(SRC[g]).then(r=>{if(!r.ok)throw 0;return r.text()}).then(t=>{if(!o.hidden){f.onload=()=>{clearTimeout(play.t);setTimeout(()=>L.classList.add('off'),Math.max(0,hold-(Date.now()-t0)))};f.srcdoc=t}})
  .catch(()=>{o.hidden=true;f.srcdoc='';toast('Couldn’t load “'+g+'”. Check the link or your connection.')});
}

const fav=new Set(LS.get('fav',[])),rec=LS.get('rec',[]);let flt='all',qry='',srt=LS.get('sort','az'),zoom=LS.get('zoom','m');
const SORTS={az:(a,b)=>a.localeCompare(b),za:(a,b)=>b.localeCompare(a),recent:(a,b)=>(rec.indexOf(a)+1||99)-(rec.indexOf(b)+1||99),fav:(a,b)=>fav.has(b)-fav.has(a)||a.localeCompare(b)};

const esc=s=>s.replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');

applyCloak(LS.get('cloak','none'));

const STEPS=[
 {i:'spark',t:()=>`No longer Nebula, but still made by ${CONFIG.maker}`,b:'A browser, a completely reimagined UI, and tons of games in one tab. Take 30 seconds to get comfy.'},
 {i:'palette',t:()=>'Make it yours',b:'Pick a theme, or make a custom one. While you’re there, add a recovery email (can be your school one) on your profile so you never get locked out.',f:1},
 {i:'ext',t:()=>'Open it in a Blob URL',b:`Want ${CONFIG.name} running from a blob: link instead of its usual address? One click opens a copy in a new tab. You can do it again anytime from Settings.`,a:1},
 {i:'check',t:()=>'You’re all set',b:'Press / to search from anywhere, and hover the top edge of any page to bring the menu back. You can change your tab cloak or reopen the Blob URL in Settings.'}
];
let ti=0;
function tour(i){
 ti=i;const s=STEPS[i],last=i===STEPS.length-1,tc=$('#tour .tc'),was=$('#tour').hidden?0:tc.getBoundingClientRect().height;
 tc.style.height='';tc.style.transition='';tc.classList.remove('lv');$('#tour').hidden=false;
 tc.innerHTML=`<div class="th"><div class="dots">${STEPS.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div><button class="tx" data-t="skip" aria-label="Close tour">${ic('x')}</button></div>`
 +`<div class="tb"><div class="ti">${ic(s.i)}</div><h3 id="tt">${s.t()}</h3><p>${s.b}</p>${s.a?'<button class="act" data-t="blob">'+ic('ext')+'Open in Blob URL</button>':''}${s.f?'<div class="fx">'+fields()+'</div>':''}</div>`
 +`<div class="tf"><button class="sk" data-t="skip">Skip tour</button><button class="nx" data-t="next">${last?'Get started':'Next'} ${ic('fwd')}</button></div>`;
 tc.querySelector('.nx').focus({preventScroll:true});
 if(was&&!RMq()){ /* morph the card to its new height */
  const h=tc.offsetHeight;tc.style.height=was+'px';tc.getBoundingClientRect();
  tc.style.transition='height .35s cubic-bezier(.2,.7,.2,1)';tc.style.height=h+'px';
  setTimeout(()=>{tc.style.height='';tc.style.transition=''},380);
 }
}
const RMq=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function endTour(){
 const t=$('#tour');if(t.hidden||t.classList.contains('bye'))return;LS.set('toured',1);
 if(RMq()){t.hidden=true;return}
 t.classList.add('bye');setTimeout(()=>{t.hidden=true;t.classList.remove('bye')},230);
}
$('#tour').onclick=e=>{
 const a=e.target.closest('[data-t]');
 if(a){
  if(a.dataset.t==='blob')return openBlob();
  if(a.dataset.t!=='next'||ti>=STEPS.length-1)return endTour();
  const tc=$('#tour .tc');if(RMq())return tour(ti+1);
  if(tc.classList.contains('lv'))return;
  tc.classList.add('lv');setTimeout(()=>tour(ti+1),150);return;
 }
 if(e.target.id==='tour')endTour();
};
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#tour').hidden)endTour()});
$('#rt').onclick=()=>tour(0);
$('#blobbtn').onclick=openBlob;
/* ---- open this page from a blob: URL ---- */
async function pageHTML(){
 if(window.top===window&&/^(https?|blob):$/.test(location.protocol)){
  try{
   const r=await fetch(location.href);
   if(r.ok){const t=await r.text();if(t.includes('const CONFIG=')&&t.includes('id="boot"'))return t}
  }catch(e){}
 }
 /* fallback (e.g. opened from disk): rebuild a clean copy of the live page */
 const c=document.documentElement.cloneNode(true),all=s=>c.querySelectorAll(s);
 all('[data-i],#tabs,#grid,#seg,#sfx,#lights,#tour .tc').forEach(e=>{e.innerHTML=''});
 const nv=c.querySelector('#nav');nv.innerHTML='';nv.removeAttribute('class');
 const ts=c.querySelector('#toast');ts.textContent='';ts.removeAttribute('class');
 c.querySelector('#tour').hidden=true;
 all('#player,link[rel=icon],base').forEach(e=>e.remove());
 all('script').forEach(sc=>{if(!sc.textContent.includes('const CONFIG='))sc.remove()});
 c.removeAttribute('style');c.removeAttribute('class');
 const b=c.querySelector('body');b.className='booting';b.dataset.view='home';b.removeAttribute('style');
 if(!c.querySelector('#boot'))b.insertAdjacentHTML('afterbegin',BOOT);
 return '<!DOCTYPE html>\n'+c.outerHTML;
}
async function openBlob(){
 const framed=window.top!==window;
 let w=null;
 if(!framed){ /* open the tab first so the click still counts while the page is built */
  w=window.open('','_blank');
  if(!w){toast('Popup blocked. Allow popups for this site and try again.');return}
 }
 try{
  const url=URL.createObjectURL(new Blob([await pageHTML()],{type:'text/html'}));
  if(w)w.location.replace(url);
  else if(!window.open(url,'_blank')){toast('Popup blocked, opening here instead.');location.assign(url)}
 }catch(e){if(w)w.close();toast('Couldn’t open the Blob URL.')}
}

/* ---- loading screen: shows until fonts and the page finish loading, then fades out ---- */
(function(){
 const boot=$('#boot'),bn=$('#bn'),bar=boot.querySelector('.bar i'),pct=$('#bpct'),msg=$('#bmsg'),t0=performance.now(),min=RMq()?150:1600;
 bn.innerHTML=[...bn.textContent].map((c,i)=>`<span style="--i:${i}">${esc(c)}</span>`).join('');
 const MSG=['Unlocking the vault…','Loading games…','Polishing the UI…','Welcome'];
 let target=0,shown=0,live=true;
 const set=p=>{target=p;bar.style.transform='scaleX('+p+')';msg.textContent=MSG[p>=1?3:p>.66?2:p>.33?1:0]};
 set(.12);const crawl=setInterval(()=>set(Math.min(.9,target+.07)),220);
 (function tick(){shown+=(target-shown)*.14;pct.textContent=Math.round(shown*100)+'%';if(live)requestAnimationFrame(tick)})();
 const loaded=new Promise(r=>document.readyState==='complete'?r():addEventListener('load',r,{once:true}));
 Promise.race([Promise.all([document.fonts?document.fonts.ready:0,loaded]),new Promise(r=>setTimeout(r,2500))]).then(()=>{
  clearInterval(crawl);set(1);
  setTimeout(()=>{
   boot.classList.add('done');document.body.classList.remove('booting');
   setTimeout(()=>{live=false;boot.remove();if(!LS.get('toured',0))tour(0)},RMq()?0:800);
  },Math.max(450,min-(performance.now()-t0)));
 });
})();

/* ---- search ---- */
const q=$('#q');
function go(){
 const v=q.value.trim();if(!v)return;
 const url=/^https?:\/\//i.test(v)?v:/^[\w-]+(\.[\w-]+)+(:\d+)?(\/\S*)?$/.test(v)?'https://'+v:CONFIG.searchUrl+encodeURIComponent(v);
 const w=window.open(url,'_blank');
 if(w)w.opener=null;else location.assign(url);
}
$('#go').onclick=go;
q.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
addEventListener('keydown',e=>{const t=view==='games'?$('#gq'):q;if(e.key==='/'&&document.activeElement!==t&&!/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){e.preventDefault();t.focus()}});

/* ---- holiday lights around the search bar ---- */
function lights(){
 const svg=$('#lights'),box=$('#sb');
 if(!CONFIG.lights){svg.remove();return}
 const P=26,w=box.offsetWidth,h=box.offsetHeight,r=h/2,cs=['#ff3d4f','#ffc934','#35e88a','#3d9bff'];
 const d=`M${P+r} ${P}H${P+w-r}A${r} ${r} 0 0 1 ${P+w-r} ${P+h}H${P+r}A${r} ${r} 0 0 1 ${P+r} ${P}Z`;
 const tmp=document.createElementNS('http://www.w3.org/2000/svg','path');tmp.setAttribute('d',d);
 const L=tmp.getTotalLength(),n=Math.round(L/30);
 let s='<defs>';
 cs.forEach((c,i)=>{s+=`<radialGradient id="lb${i}" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#fff"/><stop offset=".3" stop-color="${c}"/><stop offset="1" stop-color="${c}" stop-opacity=".7"/></radialGradient><radialGradient id="lg${i}"><stop offset="0" stop-color="${c}" stop-opacity=".6"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient>`});
 s+=`</defs><path d="${d}" fill="none" stroke="#1d4a2c" stroke-width="2.2"/>`;
 for(let i=0;i<n;i++){
  const t=i*L/n,p=tmp.getPointAtLength(t),q=tmp.getPointAtLength((t+1)%L),tx=q.x-p.x,ty=q.y-p.y,l=Math.hypot(tx,ty)||1;
  const deg=Math.atan2(-ty/l,-tx/l)*180/Math.PI,c=i%4,dl=`animation-delay:-${((i*.41)%3.2).toFixed(2)}s`;
  s+=`<g transform="translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) rotate(${deg.toFixed(1)})"><circle class="hl" cy="9" r="12" fill="url(#lg${c})" style="${dl}"/><ellipse class="bb" cy="9" rx="3.3" ry="4.6" fill="url(#lb${c})" style="${dl}"/><rect x="-1.9" width="3.8" height="5" rx="1" fill="#10261a"/></g>`;
 }
 svg.setAttribute('width',w+2*P);svg.setAttribute('height',h+2*P);svg.innerHTML=s;
}
new ResizeObserver(lights).observe($('#sb'));

/* ---- interactive background: animated noise field drawn as glowing contour lines ---- */
const cv=$('#bg'),ctx=cv.getContext('2d');
const slow=matchMedia('(prefers-reduced-motion: reduce)').matches?.15:1;

const PM=new Uint8Array(512);
for(let i=0;i<256;i++)PM[i]=i;
for(let i=255;i>0;i--){const j=Math.random()*(i+1)|0,t=PM[i];PM[i]=PM[j];PM[j]=t}
for(let i=0;i<256;i++)PM[i+256]=PM[i];
const fade=t=>t*t*t*(t*(t*6-15)+10),mix=(a,b,t)=>a+(b-a)*t;
function grad(hash,x,y,z){const h=hash&15,u=h<8?x:y,v=h<4?y:(h===12||h===14?x:z);return((h&1)?-u:u)+((h&2)?-v:v)}
/* gradient (Perlin) noise: flows more evenly over time than value noise */
function noise(x,y,z){
 const X=Math.floor(x),Y=Math.floor(y),Z=Math.floor(z);x-=X;y-=Y;z-=Z;
 const u=fade(x),v=fade(y),w=fade(z),A=PM[X&255]+(Y&255),B=PM[(X+1)&255]+(Y&255),
  AA=PM[A]+(Z&255),AB=PM[A+1]+(Z&255),BA=PM[B]+(Z&255),BB=PM[B+1]+(Z&255);
 return mix(
  mix(mix(grad(PM[AA],x,y,z),grad(PM[BA],x-1,y,z),u),mix(grad(PM[AB],x,y-1,z),grad(PM[BB],x-1,y-1,z),u),v),
  mix(mix(grad(PM[AA+1],x,y,z-1),grad(PM[BA+1],x-1,y,z-1),u),mix(grad(PM[AB+1],x,y-1,z-1),grad(PM[BB+1],x-1,y-1,z-1),u),v),w);
}

let W,H,dpr,cell,cols,rows,F;
function size(){
 dpr=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;
 cv.width=W*dpr;cv.height=H*dpr;
 cell=W<700?18:13;cols=Math.ceil(W/cell)+2;rows=Math.ceil(H/cell)+2;F=new Float32Array(cols*rows);
}
size();addEventListener('resize',size);

const m={x:0,y:0,tx:0,ty:0,s:0,ts:0,seen:false};
function aim(e){m.tx=e.clientX;m.ty=e.clientY;if(!m.seen){m.x=m.tx;m.y=m.ty;m.seen=true}m.ts=1}
addEventListener('pointermove',aim);
addEventListener('pointerdown',aim);
['pointerup','pointercancel'].forEach(n=>addEventListener(n,e=>{if(e.pointerType!=='mouse')m.ts=0}));
document.documentElement.addEventListener('pointerleave',()=>{m.ts=0});

/* marching squares: edge ids 0=top 1=right 2=bottom 3=left */
const TB=[0,[3,2],[2,1],[3,1],[0,1],null,[0,2],[0,3],[0,3],[0,2],null,[0,1],[3,1],[2,1],[3,2]];
const PX=new Float32Array(4),PY=new Float32Array(4);
function iso(path,lv){
 for(let j=0;j<rows-1;j++)for(let i=0;i<cols-1;i++){
  const k=j*cols+i,a=F[k]-lv,b=F[k+1]-lv,c=F[k+cols+1]-lv,d=F[k+cols]-lv;
  const n=(a>0?8:0)|(b>0?4:0)|(c>0?2:0)|(d>0?1:0);
  if(n===0||n===15)continue;
  const x=i*cell,y=j*cell;
  PX[0]=x+cell*a/(a-b);PY[0]=y;
  PX[1]=x+cell;PY[1]=y+cell*b/(b-c);
  PX[2]=x+cell*d/(d-c);PY[2]=y+cell;
  PX[3]=x;PY[3]=y+cell*a/(a-d);
  let s=TB[n];
  if(n===5)s=(a+b+c+d>0)?[0,3,1,2]:[0,1,3,2];
  else if(n===10)s=(a+b+c+d>0)?[0,1,3,2]:[0,3,1,2];
  for(let t=0;t<s.length;t+=2){path.moveTo(PX[s[t]],PY[s[t]]);path.lineTo(PX[s[t+1]],PY[s[t+1]])}
 }
}

let last=0,T=0;
function frame(now){
 requestAnimationFrame(frame);
 if(document.body.dataset.view!=='home')return;
 const dt=Math.min((now-last)/1000||0,.05),kp=1-Math.exp(-dt*7),ks=1-Math.exp(-dt*(m.ts?3:1.6)),f=1/380,SG=2*170*170,CUT=SG*4.5;
 last=now;T+=dt*slow;
 m.x+=(m.tx-m.x)*kp;m.y+=(m.ty-m.y)*kp;m.s+=(m.ts-m.s)*ks;
 for(let j=0;j<rows;j++){
  const y=j*cell;
  for(let i=0;i<cols;i++){
   const x=i*cell;
   let v=noise(x*f+T*.035,y*f-T*.02,T*.06)+.5*noise(x*f*2.1+7.3-T*.05,y*f*2.1+3.1+T*.03,T*.1+5);
   if(m.s>.003){const dx=x-m.x,dy=y-m.y,d2=dx*dx+dy*dy;if(d2<CUT)v+=.95*m.s*Math.exp(-d2/SG)}
   F[j*cols+i]=v;
  }
 }
 const A=new Path2D(),B=new Path2D();
 iso(A,0);iso(B,.3);iso(B,-.3);iso(B,.6);iso(B,1);
 ctx.setTransform(dpr,0,0,dpr,0,0);
 ctx.clearRect(0,0,W,H);
 ctx.globalCompositeOperation='lighter';
 ctx.lineJoin=ctx.lineCap='round';
 if(m.s>.01){
  const g=ctx.createRadialGradient(m.x,m.y,0,m.x,m.y,260);
  g.addColorStop(0,`rgba(255,50,90,${.16*m.s})`);g.addColorStop(1,'rgba(255,50,90,0)');
  ctx.fillStyle=g;ctx.fillRect(m.x-260,m.y-260,520,520);
 }
 for(const [p,k] of [[A,1],[B,.55]]){
  if(k===1){ctx.lineWidth=9;ctx.strokeStyle='rgba(255,30,70,.08)';ctx.stroke(p)}
  ctx.lineWidth=3.2;ctx.strokeStyle=`rgba(255,55,95,${.3*k})`;ctx.stroke(p);
  ctx.lineWidth=1.3;ctx.strokeStyle=`rgba(255,125,155,${.95*k})`;ctx.stroke(p);
 }
}
requestAnimationFrame(frame);
</script>
</body>
</html>
